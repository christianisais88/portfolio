<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>isaiz. | Gallery</title>
    <meta name="description" content="Selected packaging work from Christian Isais.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #09090b;
            --panel: rgba(255,255,255,0.03);
            --panel-strong: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.1);
            --text: #f5f5f5;
            --muted: #a1a1aa;
            --accent: #df3c2c;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
            background: radial-gradient(circle at top, #171717 0%, var(--bg) 55%, #050505 100%);
            color: var(--text);
            line-height: 1.6;
        }
        h1, h2, h3 {
            font-family: "Cormorant Garamond", Georgia, serif;
            letter-spacing: -0.02em;
        }
        a { color: inherit; text-decoration: none; }
        img { display: block; width: 100%; }
        .page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 20px 72px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }
        .brand {
            font-size: clamp(1.6rem, 2.6vw, 2.2rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: lowercase;
            font-family: "Cormorant Garamond", Georgia, serif;
        }
        .back-link {
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255,255,255,0.03);
            transition: border-color 180ms ease, transform 180ms ease, color 180ms ease;
        }
        .back-link:hover {
            border-color: var(--accent);
            color: white;
            transform: translateY(-1px);
        }
        .intro {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 24px;
            align-items: center;
            margin-bottom: 32px;
        }
        .intro h1 {
            font-size: clamp(2.8rem, 5.4vw, 4.3rem);
            margin: 0 0 10px;
            line-height: 0.95;
        }
        .intro p {
            margin: 0;
            color: var(--muted);
            max-width: 640px;
            font-size: 1rem;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .card {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
            border: 1px solid var(--border);
            border-radius: 22px;
            overflow: hidden;
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(223,60,44,0.45);
            box-shadow: 0 18px 45px rgba(0,0,0,0.25);
        }
        .card img {
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }
        .card-body {
            padding: 16px 16px 18px;
        }
        .card-body h2 {
            margin: 0 0 8px;
            font-size: 1.06rem;
        }
        .card-body p {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 0.95rem;
        }
        .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .pill {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            padding: 6px 8px;
            border-radius: 999px;
            background: var(--panel-strong);
            color: #d9d9d9;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.86);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal.open { display: flex; }
        .modal-card {
            width: min(960px, 100%);
            max-height: 90vh;
            overflow: auto;
            border: 1px solid var(--border);
            background: #101010;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        .modal-hero {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 0;
        }
        .modal-hero img { height: 100%; object-fit: cover; min-height: 320px; }
        .modal-content { padding: 24px 24px 28px; }
        .modal-close {
            float: right;
            background: transparent;
            border: 0;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
        }
        .modal-content h3 { margin: 0 0 10px; font-size: 1.45rem; }
        .modal-content p { color: var(--muted); margin-bottom: 16px; }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        .detail {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 12px 14px;
        }
        .detail span {
            display: block;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: #8e8e8e;
            margin-bottom: 5px;
        }
        @media (max-width: 800px) {
            .intro, .modal-hero { grid-template-columns: 1fr; }
            .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a href="index.html" class="brand">isaiz.</a>
            <a href="index.html" class="back-link">Back to portfolio</a>
        </header>

        <section class="intro">
            <div>
                <h1>Full gallery</h1>
                <p>Selected packaging concepts and production-ready applications designed for food, wellness, beauty, and lifestyle brands.</p>
            </div>
        </section>

        <section id="gallery" class="gallery-grid" aria-label="Portfolio gallery"></section>
    </div>

    <div id="modal" class="modal" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-hero">
                <img id="modalImage" alt="Project preview">
                <div class="modal-content">
                    <button id="modalClose" class="modal-close" aria-label="Close">×</button>
                    <h3 id="modalTitle"></h3>
                    <p id="modalDescription"></p>
                    <div class="pill-row" id="modalTags"></div>
                    <div class="detail-grid">
                        <div class="detail"><span>Format</span><div id="modalFormat"></div></div>
                        <div class="detail"><span>Material</span><div id="modalMaterial"></div></div>
                        <div class="detail"><span>Industry</span><div id="modalIndustry"></div></div>
                        <div class="detail"><span>Colors</span><div id="modalColors"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const projects = [
            {
                title: 'Mira Mar Productos Marinos',
                image: 'images/miramar1.png',
                description: 'Clean, nautical branding built for seafood in a flexible pouch with a transparent window.',
                tags: ['Seafood', 'Flexible Pouch'],
                format: 'Flexible pouch / bag',
                material: 'Transparent BOPP / PE laminate',
                industry: 'Seafood',
                colors: 'CMYK + White ink'
            },
            {
                title: 'Semilla de Mostaza',
                image: 'images/semilla1.png',
                description: 'Natural-health branding with a premium tincture-style presentation and metallic details.',
                tags: ['Health', 'Glass Dropper'],
                format: 'Glass dropper bottles',
                material: 'Metallic BOPP + matte lamination',
                industry: 'Natural health',
                colors: 'CMYK + White support'
            },
            {
                title: 'The H-Town Soda',
                image: 'images/htown1.png',
                description: 'A city-inspired beverage identity with a no-label, direct screen-print feel.',
                tags: ['Beverage', 'Glass Bottle'],
                format: 'Clear glass beverage bottle',
                material: 'Clear on clear BOPP',
                industry: 'Beverage',
                colors: 'White, black + spot color'
            },
            {
                title: 'Salon Pro Naturals',
                image: 'images/salon1.png',
                description: 'Clinical botanical packaging for haircare and cosmetics with a clean premium finish.',
                tags: ['Cosmetics', 'Plastic Cylinder'],
                format: 'Plastic cylinder bottles',
                material: 'White BOPP',
                industry: 'Haircare',
                colors: 'CMYK'
            },
            {
                title: 'Honesta - Vitamina C',
                image: 'images/honesta1.png',
                description: 'Vibrant citrus packaging for skincare and beauty with an apothecary-inspired mood.',
                tags: ['Skincare', 'Glass Dropper'],
                format: 'Amber / dark blue glass dropper',
                material: 'Metallic BOPP + spot UV',
                industry: 'Skincare',
                colors: 'CMYK + spot varnish'
            },
            {
                title: 'Monster Cookie Pouch',
                image: 'images/monster1.png',
                description: 'A playful food pouch concept with a window cut into the monster’s mouth.',
                tags: ['Food', 'Stand-up Pouch'],
                format: 'Stand-up pouch',
                material: 'Clear PET / LLDPE',
                industry: 'Snacks',
                colors: 'CMYK + White'
            },
            {
                title: 'Candy Kushers',
                image: 'images/candy1.png',
                description: 'Bright confectionery packaging designed to feel youthful, bold, and instantly recognizable.',
                tags: ['Confectionery', 'Stand-up Pouch'],
                format: 'Stand-up pouch',
                material: 'Metallic BOPP',
                industry: 'Confectionery',
                colors: 'CMYK + White'
            },
            {
                title: 'Premium Anchored',
                image: 'images/anchored1.png',
                description: 'Vintage-inspired premium packaging for extracts with foil-stamped detailing.',
                tags: ['Vape', 'Folding Carton'],
                format: 'Folding carton box',
                material: 'SBS paperboard',
                industry: 'Extracts',
                colors: 'Black + gold foil'
            },
            {
                title: 'Cere Pax',
                image: 'images/cerepax1.png',
                description: 'A high-energy supplement design with metallic visuals and an elevated product story.',
                tags: ['Wellness', 'PET Bottle'],
                format: 'PET bottle',
                material: 'Glossy sleeve',
                industry: 'Supplements',
                colors: 'CMYK + White support'
            },
            {
                title: 'Creatine Monohydrate',
                image: 'images/unike1.png',
                description: 'High-contrast sports nutrition packaging built around performance and clarity.',
                tags: ['Sports', 'Plastic Tub'],
                format: 'Plastic tub',
                material: 'Metallic PP',
                industry: 'Sports nutrition',
                colors: 'CMYK + neon spot'
            },
            {
                title: 'Belly Drops',
                image: 'images/belly1.png',
                description: 'A clean wellness concept for a dark glass bottle with a premium matte finish.',
                tags: ['Wellness', 'Dark Glass'],
                format: 'Dark glass bottle',
                material: 'Uncoated paper label',
                industry: 'Supplements',
                colors: 'CMYK'
            },
            {
                title: 'Casa Refill',
                image: 'images/casa1.png',
                description: 'A spa-inspired hospitality concept with minimalist labels and a premium tactile feel.',
                tags: ['Hospitality', 'Pump Bottle'],
                format: 'Amber glass / PET bottles',
                material: 'Matte black vinyl',
                industry: 'Cosmetics',
                colors: 'White ink'
            }
        ];

        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalDescription = document.getElementById('modalDescription');
        const modalTags = document.getElementById('modalTags');
        const modalFormat = document.getElementById('modalFormat');
        const modalMaterial = document.getElementById('modalMaterial');
        const modalIndustry = document.getElementById('modalIndustry');
        const modalColors = document.getElementById('modalColors');
        const modalClose = document.getElementById('modalClose');

        function renderGallery() {
            gallery.innerHTML = projects.map((project, index) => `
                <article class="card" role="button" tabindex="0" data-index="${index}">
                    <img src="${project.image}" alt="${project.title}" loading="lazy">
                    <div class="card-body">
                        <h2>${project.title}</h2>
                        <p>${project.description}</p>
                        <div class="pill-row">
                            ${project.tags.map(tag => `<span class="pill">${tag}</span>`).join('')}
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function openModal(index) {
            const project = projects[index];
            if (!project) return;
            modalImage.src = project.image;
            modalImage.alt = project.title;
            modalTitle.textContent = project.title;
            modalDescription.textContent = project.description;
            modalTags.innerHTML = project.tags.map(tag => `<span class="pill">${tag}</span>`).join('');
            modalFormat.textContent = project.format;
            modalMaterial.textContent = project.material;
            modalIndustry.textContent = project.industry;
            modalColors.textContent = project.colors;
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function closeModal() {
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
        }

        gallery.addEventListener('click', (event) => {
            const card = event.target.closest('.card');
            if (!card) return;
            openModal(Number(card.dataset.index));
        });

        gallery.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                const card = event.target.closest('.card');
                if (card) {
                    event.preventDefault();
                    openModal(Number(card.dataset.index));
                }
            }
        });

        modal.addEventListener('click', (event) => {
            if (event.target === modal) closeModal();
        });

        modalClose.addEventListener('click', closeModal);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModal();
        });

        renderGallery();
    </script>
</body>
</html>
